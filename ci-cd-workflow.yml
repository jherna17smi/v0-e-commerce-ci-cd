# =============================================================================
# CI/CD WORKFLOW — SETUP INSTRUCTIONS
# =============================================================================
# v0's GitHub connection cannot push files inside `.github/workflows/`, so this
# file lives at the project root instead. To activate the pipeline, recreate it
# on GitHub (which has full permissions):
#
#   1. Go to your repo on github.com
#   2. Click "Add file" -> "Create new file"
#   3. Name the file EXACTLY:  .github/workflows/main.yml
#      (typing the slashes creates the folders automatically)
#   4. Paste everything BELOW the line of equals signs
#   5. Commit to the `main` branch
#
# Then add these repository secrets under
# Settings -> Secrets and variables -> Actions:
#   - VERCEL_TOKEN       (vercel.com/account/tokens)
#   - VERCEL_ORG_ID      (Vercel project settings / .vercel/project.json)
#   - VERCEL_PROJECT_ID  (Vercel project settings / .vercel/project.json)
# =============================================================================

name: CI/CD

# Trigger the pipeline on pushes and pull requests to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Continuous Integration: install dependencies, lint, build, and run tests.
  # The deploy job depends on this job, so deployment only happens if CI passes.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit & integration tests (Jest)
        run: pnpm test:ci

      - name: Build application
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Continuous Deployment: deploy to Vercel only on pushes to main, and only
  # after the build-and-test job has succeeded.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only deploy on direct pushes to main (not pull requests).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
